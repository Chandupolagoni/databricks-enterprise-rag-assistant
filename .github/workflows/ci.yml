name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install pdfplumber pypdf python-docx beautifulsoup4 pytest ruff
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests + offline RAG evaluation
        run: pytest -q
